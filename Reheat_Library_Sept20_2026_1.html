<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Reheating Instructions — Week of Sept 20, 2026</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@400;500&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --navy: #161455; --gold: #c9a84c; --cream: #faf9f6;
    --text: #1a1a2e; --muted: #6b6b8a; --border: #dcdce8;
    --card: #ffffff; --radius: 10px;
  }
  body { font-family: 'Inter', sans-serif; background: var(--cream); color: var(--text); min-height: 100vh; }
  header { background: var(--navy); padding: 2rem 1.5rem 1.5rem; text-align: center; }
  .logo-line { font-family: 'Playfair Display', serif; font-size: 0.75rem; letter-spacing: 0.15em; color: var(--gold); text-transform: uppercase; margin-bottom: 0.5rem; }
  header h1 { font-family: 'Playfair Display', serif; font-size: clamp(1.6rem, 5vw, 2.4rem); font-weight: 600; color: #fff; line-height: 1.2; }
  header p { margin-top: 0.4rem; font-size: 0.85rem; color: rgba(255,255,255,0.6); }
  .search-wrap { background: var(--navy); padding: 0 1.5rem 1.75rem; }
  .search-box { max-width: 560px; margin: 0 auto; position: relative; }
  .search-box input { width: 100%; padding: 0.85rem 1.1rem 0.85rem 2.8rem; font-family: 'Inter', sans-serif; font-size: 1rem; border: none; border-radius: var(--radius); background: #fff; color: var(--text); outline: none; box-shadow: 0 2px 12px rgba(0,0,0,0.2); }
  .search-box input::placeholder { color: var(--muted); }
  .search-icon { position: absolute; left: 0.9rem; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
  .clear-btn { position: absolute; right: 0.9rem; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--muted); cursor: pointer; font-size: 1.1rem; display: none; padding: 0; line-height: 1; }
  main { max-width: 720px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
  .results-count { font-size: 0.8rem; color: var(--muted); margin-bottom: 1.25rem; min-height: 1.2em; }
  .category-block { margin-bottom: 2rem; }
  .category-label { font-family: 'Playfair Display', serif; font-size: 1.05rem; font-weight: 600; color: var(--navy); border-bottom: 2px solid var(--gold); padding-bottom: 0.35rem; margin-bottom: 0.9rem; }
  .dish-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem 1.15rem; margin-bottom: 0.65rem; cursor: pointer; transition: box-shadow 0.15s, border-color 0.15s; }
  .dish-card:hover { box-shadow: 0 2px 10px rgba(22,20,85,0.08); border-color: var(--navy); }
  .dish-card.open { border-color: var(--navy); }
  .dish-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.75rem; }
  .dish-name { font-family: 'Playfair Display', serif; font-size: 0.95rem; font-weight: 600; color: var(--navy); line-height: 1.35; }
  .dish-name mark { background: #fff3b0; color: var(--navy); border-radius: 2px; }
  .chevron { flex-shrink: 0; width: 18px; height: 18px; color: var(--muted); transition: transform 0.2s; }
  .dish-card.open .chevron { transform: rotate(180deg); }
  .dish-instructions { display: none; margin-top: 0.75rem; padding-top: 0.75rem; border-top: 1px solid var(--border); font-size: 0.9rem; line-height: 1.65; color: #2e2e4a; }
  .dish-card.open .dish-instructions { display: block; }
  .empty-state { text-align: center; padding: 3rem 1rem; color: var(--muted); display: none; }
  .empty-state p { font-size: 0.95rem; margin-top: 0.5rem; }
  footer { text-align: center; padding: 1.5rem; font-family: 'Playfair Display', serif; font-size: 0.85rem; color: var(--muted); border-top: 1px solid var(--border); }
</style>
</head>
<body>
<header>
  <div class="logo-line">Empowered Foodie</div>
  <h1>Reheating Instructions</h1>
  <p>Week of September 20, 2026</p>
</header>
<div class="search-wrap">
  <div class="search-box">
    <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" id="search" placeholder="Search for a dish…" autocomplete="off" autocorrect="off" spellcheck="false"/>
    <button class="clear-btn" id="clearBtn" aria-label="Clear search">✕</button>
  </div>
</div>
<main>
  <div class="results-count" id="resultsCount"></div>
  <div id="dishList"></div>
  <div class="empty-state" id="emptyState">
    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#9999b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <p>No dishes found for "<span id="emptyQuery"></span>"</p>
  </div>
</main>
<footer>Infused with Love by Empowered Foodie</footer>
<script>
const DISHES = [
  // BREAKFAST & BAKED GOODS
  { category: "Breakfast & Baked Goods", name: "GF Healthy Carrot Cake Loaf", instructions: "Enjoy at room temperature. To warm, preheat oven to 300°F, wrap loosely in foil, and warm for 8–10 minutes. Best within 4–5 days. Can be frozen up to 1 month." },
  { category: "Breakfast & Baked Goods", name: "GF Pumpkin Spice Snickerdoodles — No Refined Sugars", instructions: "Enjoy at room temperature straight from the container. To warm, preheat oven to 300°F, place on a sheet tray, cover loosely with foil, and warm for 4–5 minutes. Best within 5–6 days. Can be frozen up to 1 month." },
  { category: "Breakfast & Baked Goods", name: "Granola Bars with Pistachios, Dried Cranberries, Dates, Oats, Almonds & Pumpkin Seeds", instructions: "Enjoy at room temperature — no heating needed. Store in an airtight container or keep wrapped. Best within 1–2 weeks. Can be frozen up to 2 months." },
  { category: "Breakfast & Baked Goods", name: "Egg Muffin Cups with Onions, Peppers, Broccoli & Cheese", instructions: "Preheat oven to 325°F. Place on a sheet tray, cover loosely with foil, and warm for 8–10 minutes until heated through. Best within 4–5 days. Can be frozen up to 1 month." },

  // DIPS
  { category: "Dips", name: "Black Bean Jalapeño Hummus", instructions: "Serve cold or at room temperature — no heating needed. Stir well before serving. Best within 5–6 days." },
  { category: "Dips", name: "Mango Salsa", instructions: "Serve cold — no heating needed. Stir gently before serving. Best within 3–4 days." },
  { category: "Dips", name: "Classic Hummus", instructions: "Serve cold or at room temperature — no heating needed. Stir well before serving. Best within 5–6 days." },

  // SOUPS
  { category: "Soups — Stovetop", name: "Minestrone Soup", instructions: "Pour into a saucepan over medium heat. Warm for 8–10 minutes, stirring occasionally, until hot throughout. Reduce to low and simmer gently if not serving immediately. Add a splash of broth or water if the soup has thickened. Best within 4–5 days." },
  { category: "Soups — Stovetop", name: "White Bean Chicken Chili", instructions: "Pour into a saucepan over medium heat. Warm for 8–10 minutes, stirring occasionally, until hot throughout. Reduce to low and simmer gently if not serving immediately. Add a splash of broth or water if it has thickened. Best within 4–5 days." },

  // KIDS / COMFORT FOODS
  { category: "Kids / Comfort Foods", name: "Pulled Pork with Purple Slaw & Roasted Broccoli", instructions: "Preheat oven to 350°F. Transfer pulled pork to an oven-safe dish, cover tightly with foil, and warm for 18–22 minutes until heated through. Place broccoli on a separate sheet tray uncovered and warm at 400°F for 6–8 minutes to re-crisp. Serve purple slaw cold on the side or on top. Best within 4–5 days." },
  { category: "Kids / Comfort Foods", name: "Chicken & Cheese Quesadillas with Roasted Broccoli", instructions: "Preheat oven to 375°F. Place quesadillas on a sheet tray uncovered and warm for 8–10 minutes, flipping once halfway, until heated through and the tortilla is lightly crispy. Place broccoli on a separate sheet tray uncovered and warm at 400°F for 6–8 minutes alongside. Best within 3–4 days." },
  { category: "Kids / Comfort Foods", name: "Beef Taco Meat with Corn Tortillas & Roasted Broccoli", instructions: "Preheat oven to 350°F. Transfer taco meat to an oven-safe dish, cover tightly with foil, and warm for 12–15 minutes, stirring once halfway. Wrap corn tortillas in a separate piece of foil and warm alongside for the last 5 minutes. Place broccoli on a separate sheet tray uncovered and warm at 400°F for 6–8 minutes. Best within 3–4 days." },
  { category: "Kids / Comfort Foods", name: "Baked Ziti with Roasted Broccoli", instructions: "Preheat oven to 375°F. Transfer to an oven-safe dish, cover tightly with foil, and warm for 20–25 minutes until heated through and sauce is bubbling. Uncover for the last 5 minutes to melt and brown the cheese. Place broccoli on a separate sheet tray uncovered and warm at 400°F for 6–8 minutes alongside. Best within 4–5 days." },
  { category: "Kids / Comfort Foods", name: "Chicken Meatballs with Spaghetti & Roasted Broccoli", instructions: "Preheat oven to 350°F. Transfer to an oven-safe dish, cover tightly with foil, and warm for 18–22 minutes until heated through and sauce is bubbling, stirring once halfway. Place broccoli on a separate sheet tray uncovered and warm at 400°F for 6–8 minutes alongside. Best within 4–5 days." },

  // LUNCH BOWLS & SALADS
  { category: "Lunch Bowls & Salads", name: "Moroccan Spiced Chicken Kabab Bowl with Lemon Yogurt Sauce over Rice with a Chopped Salad", instructions: "Preheat oven to 350°F. Transfer chicken and rice to an oven-safe dish, cover tightly with foil, and warm for 15–18 minutes until heated through. Serve lemon yogurt sauce and chopped salad cold on the side. Best within 4–5 days." },
  { category: "Lunch Bowls & Salads", name: "Moroccan Spiced Nourish Bowl with Crunchy Chickpeas, Roasted Cauliflower, Turmeric Couscous & Parsley Salad", instructions: "Preheat oven to 350°F. Transfer couscous and cauliflower to an oven-safe dish, cover tightly with foil, and warm for 12–15 minutes until heated through. Serve chickpeas and parsley salad cold on the side for best texture. Best within 3–4 days." },
  { category: "Lunch Bowls & Salads", name: "Lox Bagel Rice Bowl with Dill, Capers, Lox, Soft Boiled Egg & Rice", instructions: "Serve cold — no heating needed. This bowl is best enjoyed at room temperature. If you prefer warm rice, transfer rice only to an oven-safe dish with a splash of water, cover tightly with foil, and warm at 325°F for 10–12 minutes. Serve lox, egg, capers, and dill cold on top. Best within 2–3 days." },
  { category: "Lunch Bowls & Salads", name: "Grilled Steak Rice Bowl with Fresh Chimichurri Sauce & Corn Salad over Rice", instructions: "Preheat oven to 300°F. Transfer steak and rice to an oven-safe dish, cover tightly with foil, and warm for 12–15 minutes — low and slow keeps the steak tender. Serve chimichurri and corn salad cold on the side or spooned over just before eating. Best within 3–4 days." },
  { category: "Lunch Bowls & Salads", name: "Chickpea Mock Tuna Salad over Mixed Greens", instructions: "Serve cold — no heating needed. Toss gently before serving and dress just before eating. Best within 3–4 days." },
  { category: "Lunch Bowls & Salads", name: "Warm Broccoli & Couscous Salad", instructions: "Preheat oven to 325°F. Transfer to an oven-safe dish, cover tightly with foil, and warm for 10–12 minutes until heated through. Toss gently and serve warm or at room temperature. Best within 3–4 days." },
  { category: "Lunch Bowls & Salads", name: "Triple Bean Salad", instructions: "Serve cold or at room temperature — no heating needed. Toss gently before serving as dressing may settle. Best within 4–5 days." },

  // MAIN DISHES
  { category: "Main Dishes", name: "Roasted Cod with Miso Butter Sauce over Cilantro Rice & Roasted Broccoli", instructions: "Preheat oven to 300°F. Transfer cod and rice to an oven-safe dish, cover tightly with foil, and warm for 10–12 minutes until just heated through — low and slow keeps the fish moist. Place broccoli on a separate sheet tray uncovered and warm at 400°F for 6–8 minutes to re-crisp alongside. Best within 2–3 days." },
  { category: "Main Dishes", name: "Salmon with Mango Salsa & Coconut Rice", instructions: "Preheat oven to 300°F. Transfer salmon and rice to an oven-safe dish, cover tightly with foil, and warm for 10–12 minutes until just heated through — low and slow keeps the salmon moist. Serve mango salsa cold on the side or spooned over just before eating. Best within 2–3 days." },
  { category: "Main Dishes", name: "Shrimp Scampi Orzo", instructions: "Preheat oven to 325°F. Transfer to an oven-safe dish, cover tightly with foil, and warm for 12–15 minutes until heated through — do not overheat the shrimp. Add a small splash of water or broth before covering if needed to keep it saucy. Best within 2–3 days." },
  { category: "Main Dishes", name: "Chicken Marsala over Mashed Potatoes with Roasted Brussels Sprouts", instructions: "Preheat oven to 350°F. Transfer chicken marsala and mashed potatoes to an oven-safe dish, cover tightly with foil, and warm for 18–22 minutes until heated through and sauce is bubbling. Place brussels sprouts on a separate sheet tray uncovered and warm at 400°F for 6–8 minutes to re-crisp alongside. Best within 4–5 days." },
  { category: "Main Dishes", name: "Greek Lamb Meatballs with Lemon Potatoes & Greek Chopped Salad", instructions: "Preheat oven to 350°F. Transfer meatballs and potatoes to an oven-safe dish, cover tightly with foil, and warm for 18–22 minutes until heated through. Serve Greek chopped salad cold on the side. Best within 4–5 days." },
  { category: "Main Dishes", name: "Zucchini Lasagna", instructions: "Preheat oven to 375°F. Cover tightly with foil and warm for 22–25 minutes until heated through and sauce is bubbling. Uncover for the last 5 minutes to melt and brown the cheese. Best within 4–5 days." },
];

function groupByCategory(dishes) {
  const groups = {};
  dishes.forEach(d => { if (!groups[d.category]) groups[d.category] = []; groups[d.category].push(d); });
  return groups;
}

function highlight(text, query) {
  if (!query) return text;
  const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return text.replace(new RegExp(`(${escaped})`, 'gi'), '<mark>$1</mark>');
}

function render(query) {
  const q = query.trim().toLowerCase();
  const filtered = q ? DISHES.filter(d => d.name.toLowerCase().includes(q) || d.category.toLowerCase().includes(q) || d.instructions.toLowerCase().includes(q)) : DISHES;
  const list = document.getElementById('dishList');
  const empty = document.getElementById('emptyState');
  const count = document.getElementById('resultsCount');
  document.getElementById('clearBtn').style.display = q ? 'block' : 'none';
  if (filtered.length === 0) {
    list.innerHTML = ''; empty.style.display = 'block';
    document.getElementById('emptyQuery').textContent = query; count.textContent = ''; return;
  }
  empty.style.display = 'none';
  count.textContent = q ? `${filtered.length} dish${filtered.length !== 1 ? 'es' : ''} found` : `${DISHES.length} dishes this week`;
  const groups = groupByCategory(filtered);
  let html = '';
  Object.entries(groups).forEach(([cat, dishes]) => {
    html += `<div class="category-block"><div class="category-label">${cat}</div>`;
    dishes.forEach((d, i) => {
      const id = `d-${cat}-${i}`.replace(/[^a-zA-Z0-9-]/g, '-');
      html += `<div class="dish-card" id="${id}" onclick="toggle('${id}')">
        <div class="dish-header">
          <div class="dish-name">${highlight(d.name, query)}</div>
          <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
        <div class="dish-instructions">${d.instructions}</div>
      </div>`;
    });
    html += `</div>`;
  });
  list.innerHTML = html;
  if (filtered.length === 1) { const f = list.querySelector('.dish-card'); if (f) f.classList.add('open'); }
}

function toggle(id) { document.getElementById(id).classList.toggle('open'); }

const searchInput = document.getElementById('search');
document.getElementById('clearBtn').addEventListener('click', () => { searchInput.value = ''; render(''); searchInput.focus(); });
searchInput.addEventListener('input', () => render(searchInput.value));
render('');
</script>
</body>
</html>

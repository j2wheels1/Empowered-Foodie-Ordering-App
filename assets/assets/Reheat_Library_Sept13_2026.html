<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Reheating Instructions — Week of Sept 13, 2026</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@400;500&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --navy: #161455; --navy-light: #eeedf8; --gold: #c9a84c;
    --cream: #faf9f6; --text: #1a1a2e; --muted: #6b6b8a;
    --border: #dcdce8; --card: #ffffff; --radius: 10px;
  }
  body { font-family: 'Inter', sans-serif; background: var(--cream); color: var(--text); min-height: 100vh; }
  header { background: var(--navy); padding: 2rem 1.5rem 1.5rem; text-align: center; }
  .logo-line { font-family: 'Playfair Display', serif; font-size: 0.75rem; letter-spacing: 0.15em; color: var(--gold); text-transform: uppercase; margin-bottom: 0.5rem; }
  header h1 { font-family: 'Playfair Display', serif; font-size: clamp(1.6rem, 5vw, 2.4rem); font-weight: 600; color: #fff; line-height: 1.2; }
  header p { margin-top: 0.4rem; font-size: 0.85rem; color: rgba(255,255,255,0.6); }
  .search-wrap { background: var(--navy); padding: 0 1.5rem 1.75rem; }
  .search-box { max-width: 560px; margin: 0 auto; position: relative; }
  .search-box input { width: 100%; padding: 0.85rem 1.1rem 0.85rem 2.8rem; font-family: 'Inter', sans-serif; font-size: 1rem; border: none; border-radius: var(--radius); background: #fff; color: var(--text); outline: none; box-shadow: 0 2px 12px rgba(0,0,0,0.2); }
  .search-box input::placeholder { color: var(--muted); }
  .search-icon { position: absolute; left: 0.9rem; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
  .clear-btn { position: absolute; right: 0.9rem; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--muted); cursor: pointer; font-size: 1.1rem; display: none; padding: 0; line-height: 1; }
  main { max-width: 720px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
  .results-count { font-size: 0.8rem; color: var(--muted); margin-bottom: 1.25rem; min-height: 1.2em; }
  .category-block { margin-bottom: 2rem; }
  .category-label { font-family: 'Playfair Display', serif; font-size: 1.05rem; font-weight: 600; color: var(--navy); border-bottom: 2px solid var(--gold); padding-bottom: 0.35rem; margin-bottom: 0.9rem; }
  .dish-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem 1.15rem; margin-bottom: 0.65rem; cursor: pointer; transition: box-shadow 0.15s, border-color 0.15s; }
  .dish-card:hover { box-shadow: 0 2px 10px rgba(22,20,85,0.08); border-color: var(--navy); }
  .dish-card.open { border-color: var(--navy); }
  .dish-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.75rem; }
  .dish-name { font-family: 'Playfair Display', serif; font-size: 0.95rem; font-weight: 600; color: var(--navy); line-height: 1.35; }
  .dish-name mark { background: #fff3b0; color: var(--navy); border-radius: 2px; }
  .chevron { flex-shrink: 0; width: 18px; height: 18px; color: var(--muted); transition: transform 0.2s; }
  .dish-card.open .chevron { transform: rotate(180deg); }
  .dish-instructions { display: none; margin-top: 0.75rem; padding-top: 0.75rem; border-top: 1px solid var(--border); font-size: 0.9rem; line-height: 1.65; color: #2e2e4a; }
  .dish-card.open .dish-instructions { display: block; }
  .empty-state { text-align: center; padding: 3rem 1rem; color: var(--muted); display: none; }
  .empty-state p { font-size: 0.95rem; margin-top: 0.5rem; }
  footer { text-align: center; padding: 1.5rem; font-family: 'Playfair Display', serif; font-size: 0.85rem; color: var(--muted); border-top: 1px solid var(--border); }
</style>
</head>
<body>
<header>
  <div class="logo-line">Empowered Foodie</div>
  <h1>Reheating Instructions</h1>
  <p>Week of September 13, 2026</p>
</header>
<div class="search-wrap">
  <div class="search-box">
    <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" id="search" placeholder="Search for a dish…" autocomplete="off" autocorrect="off" spellcheck="false"/>
    <button class="clear-btn" id="clearBtn" aria-label="Clear search">✕</button>
  </div>
</div>
<main>
  <div class="results-count" id="resultsCount"></div>
  <div id="dishList"></div>
  <div class="empty-state" id="emptyState">
    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#9999b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <p>No dishes found for "<span id="emptyQuery"></span>"</p>
  </div>
</main>
<footer>Infused with Love by Empowered Foodie</footer>

  { category: "Breakfast & Baked Goods", name: "GF Apple Cinnamon Crumb Muffins with Applesauce, Eggs, Vanilla, Cinnamon, Brown Sugar, GF Flour & Butter", instructions: "Enjoy at room temperature. To warm, preheat oven to 300°F, place on a sheet tray, cover loosely with foil, and warm for 5–6 minutes. Best within 4–5 days. Can be frozen up to 1 month." },

  { category: "Breakfast & Baked Goods", name: "Egg Muffin Cups with Ham, Spinach, Scallions & Cheddar", instructions: "Preheat oven to 325°F. Place on a sheet tray, cover loosely with foil, and warm for 8–10 minutes until heated through. Best within 4–5 days. Can be frozen up to 1 month." },

  { category: "Dips", name: "Cilantro Pistachio Hummus with Chickpeas, Cilantro, Pistachios, Lime, Jalapeños, Tahini, Parmesan & Olive Oil", instructions: "Serve cold or at room temperature — no heating needed. Stir well before serving. Best within 5–6 days." },
  { category: "Dips", name: "Buttermilk Ranch Dip with Sour Cream, Buttermilk, Mayo, Garlic, Dill, Chives & Lemon", instructions: "Serve cold — no heating needed. Stir well before serving. Best within 4–5 days." },

  // SOUPS
  { category: "Soups — Stovetop", name: "Charred Corn & Jalapeño Chicken Chowder with Roasted Corn, Paprika, Cumin, Poblano Pepper, Jalapeño, Golden Potatoes, Onion, Garlic, Oregano, Cream, Lime, Cilantro, Monterey Jack Cheese & Blackened Chicken", instructions: "Pour into a saucepan over medium heat. Warm for 8–10 minutes, stirring occasionally, until hot throughout. Reduce to low and simmer gently if not serving immediately. Add a splash of broth or water if the soup has thickened. Best within 4–5 days." },
  { category: "Soups — Stovetop", name: "Greek Chicken & Orzo Soup", instructions: "Pour into a saucepan over medium heat. Warm for 8–10 minutes, stirring occasionally, until hot throughout. Reduce to low and simmer gently if not serving immediately. Add a splash of broth or water if the soup has thickened. Best within 4–5 days." },
  { category: "Soups — Stovetop", name: "Roasted Red Pepper Soup with Garlic, Red Peppers, Carrots, Cauliflower, Tomatoes, Onion, Olive Oil, Smoked Paprika, Cumin & Lemon", instructions: "Pour into a saucepan over medium heat. Warm for 8–10 minutes, stirring occasionally, until hot throughout. Reduce to low and simmer gently if not serving immediately. Add a splash of broth or water if the soup has thickened. Serve croutons on the side to keep them crispy. Best within 4–5 days." },

  // KIDS / COMFORT FOODS
  { category: "Kids / Comfort Foods", name: "Pepperoni & Mozzarella Hot Pockets", instructions: "Preheat oven to 375°F. Place on a sheet tray uncovered and warm for 10–12 minutes, flipping once halfway, until heated through and the pastry is golden and crispy. Best within 3–4 days. Can be frozen up to 1 month — add 3–5 minutes if warming from frozen." },
  { category: "Kids / Comfort Foods", name: "Italian Ricotta Meatballs with Marinara Sauce & Penne Pasta", instructions: "Preheat oven to 350°F. Transfer to an oven-safe dish, cover tightly with foil, and warm for 18–22 minutes until heated through and sauce is bubbling, stirring once halfway. If you prefer sauce on the side, warm it separately in a small saucepan over low heat for 5–6 minutes. Best within 4–5 days." },

  { category: "Kids / Comfort Foods", name: "Chicken Schnitzel with Roasted Baby Potatoes", instructions: "Preheat oven to 400°F. Place schnitzel on a sheet tray uncovered and warm for 8–10 minutes, flipping once halfway, until hot and crispy — do not cover or the breading will soften. Transfer potatoes to a separate oven-safe dish, cover loosely with foil, and warm alongside for 10–12 minutes. Best within 3–4 days." },

  // LUNCH BOWLS & SALADS
  { category: "Lunch Bowls & Salads", name: "Detox Salad with Kale, Broccoli, Red Cabbage, Carrots, Cilantro, Slivered Almonds, Scallions, Avocado & Carrot Ginger Dressing", instructions: "Serve cold — no heating needed. Add avocado just before serving if stored separately. Dress just before eating and toss gently to coat. Best within 3–4 days." },
  { category: "Lunch Bowls & Salads", name: "Mediterranean Orzo Salad with Red Onion, Olives, Marinated Artichoke Hearts, Cherry Tomatoes, Pepperoncini, Cucumber, Chickpeas, Feta, Basil & Red Wine Vinaigrette", instructions: "Serve cold or at room temperature — no heating needed. Toss gently before serving as dressing may settle. Best within 4–5 days." },
  { category: "Lunch Bowls & Salads", name: "Balsamic Chicken & Farro Bowl with Mozzarella Pearls, Basil, Slow Roasted Cherry Tomatoes & Balsamic Glaze", instructions: "Preheat oven to 325°F. Transfer chicken and farro to an oven-safe dish, cover tightly with foil, and warm for 15–18 minutes until heated through. Serve mozzarella pearls, fresh basil, and balsamic glaze cold on top just before eating. Best within 4–5 days." },
  { category: "Lunch Bowls & Salads", name: "Fiesta Salmon Rice Bowl with Corn & Black Bean Salsa, Cilantro Lime Rice & Avocado", instructions: "Preheat oven to 300°F. Transfer salmon and rice to an oven-safe dish, cover tightly with foil, and warm for 10–12 minutes until just heated through — low and slow keeps the salmon moist. Serve corn & black bean salsa and avocado cold on the side. Best within 2–3 days." },

  // MAIN DISHES
  { category: "Main Dishes", name: "Low Carb Chicken & Cabbage Stir Fry with Ground Chicken, Ginger, Garlic, Scallions, Chili, Shredded Cabbage & Herbs", instructions: "Preheat oven to 350°F. Transfer to an oven-safe dish, cover tightly with foil, and warm for 15–18 minutes until heated through, stirring once halfway. Best within 4–5 days." },
  { category: "Main Dishes", name: "Garlic Butter Salmon with Spinach & Mushrooms over Polenta with Creamy Sauce & Grilled Asparagus", instructions: "Preheat oven to 300°F. Transfer to an oven-safe dish, cover tightly with foil, and warm for 12–15 minutes until just heated through — low and slow keeps the salmon moist. Best within 2–3 days." },
  { category: "Main Dishes", name: "Pork Vindaloo over Jasmine Rice with Garlic, Paprika, Coriander, Cardamom, Ginger & Roasted Broccoli", instructions: "Preheat oven to 350°F. Transfer to an oven-safe dish, cover tightly with foil, and warm for 20–25 minutes until heated through and sauce is bubbling, stirring once halfway. Best within 4–5 days." },
  { category: "Main Dishes", name: "Ginger Basil Beef & Zucchini over Rice with Shallots, Ginger, Garlic, Liquid Aminos, Fish Sauce, Rice Vinegar, Gochujang & Basil", instructions: "Preheat oven to 350°F. Transfer to an oven-safe dish, cover tightly with foil, and warm for 18–22 minutes until heated through, stirring once halfway. Best within 4–5 days." },
  { category: "Main Dishes", name: "Lemon Braised Chicken Thighs with Golden Potatoes, Rosemary, Oregano, Garlic, Lemon & Garlicky Green Beans", instructions: "Preheat oven to 350°F. Transfer to an oven-safe dish, cover tightly with foil, and warm for 20–25 minutes until heated through and braising liquid is bubbling. Best within 4–5 days." },
  { category: "Main Dishes", name: "Vegan Meatloaf with Lentils, Quinoa, Garlic, Thyme, Sage, Ground Flaxseed, Walnuts, Carrots, Onion, Celery, Liquid Aminos, Dijon, Balsamic Vinegar & Parsley over Grilled Zucchini & Yellow Squash", instructions: "Preheat oven to 350°F. Transfer to an oven-safe dish, cover tightly with foil, and warm for 20–25 minutes until heated through. Uncover for the last 5 minutes for a lightly set top. Place zucchini and squash in a separate oven-safe dish, cover loosely with foil, and warm alongside for the last 8–10 minutes. Best within 4–5 days." },

  // CLEAN EATS — PROTEINS
  { category: "Clean Eats — Proteins", name: "Asian Turkey Burgers", instructions: "Preheat oven to 350°F. Place in an oven-safe dish, cover tightly with foil, and warm for 12–15 minutes until heated through. Serve any sauce cold on the side or spooned over just before eating. Best within 3–4 days." },
  { category: "Clean Eats — Proteins", name: "Grilled Salmon", instructions: "Preheat oven to 300°F. Place in an oven-safe dish, cover tightly with foil, and warm for 10–12 minutes until just heated through — low and slow keeps the salmon moist. Best within 2–3 days." },
  { category: "Clean Eats — Proteins", name: "Grilled Chicken Breast", instructions: "Preheat oven to 325°F. Place in an oven-safe dish, cover tightly with foil, and warm for 12–15 minutes until heated through. Best within 4–5 days." },
  { category: "Clean Eats — Proteins", name: "Grass-Fed Ground Beef", instructions: "Preheat oven to 350°F. Transfer to an oven-safe dish, cover tightly with foil, and warm for 12–15 minutes until heated through, stirring once halfway. Best within 4–5 days." },

  // CLEAN EATS — STARCHES
  { category: "Clean Eats — Starches", name: "Jasmine Rice", instructions: "Preheat oven to 325°F. Transfer to an oven-safe dish, add a splash of water, cover tightly with foil, and warm for 10–12 minutes. Fluff with a fork before serving. Best within 4–5 days." },
  { category: "Clean Eats — Starches", name: "Quinoa", instructions: "Preheat oven to 325°F. Transfer to an oven-safe dish, add a splash of water, cover tightly with foil, and warm for 10–12 minutes. Fluff with a fork before serving. Best within 4–5 days." },
  { category: "Clean Eats — Starches", name: "Roasted Baby Potatoes", instructions: "Preheat oven to 400°F. Spread on a sheet tray uncovered and warm for 8–10 minutes until hot and slightly crispy. Do not cover — keeping them uncovered brings the texture back. Best within 4–5 days." },
  { category: "Clean Eats — Starches", name: "Roasted Sweet Potatoes", instructions: "Preheat oven to 400°F. Spread on a sheet tray uncovered and warm for 8–10 minutes until hot and slightly caramelized. Do not cover. Best within 4–5 days." },

  // CLEAN EATS — VEGGIES
  { category: "Clean Eats — Veggies", name: "Roasted Broccoli", instructions: "Preheat oven to 400°F. Spread on a sheet tray uncovered and warm for 6–8 minutes until hot and slightly re-crisped. Do not cover or it will steam and lose the texture. Best within 3–4 days." },
  { category: "Clean Eats — Veggies", name: "Steamed Green Beans", instructions: "Preheat oven to 375°F. Spread on a sheet tray, cover loosely with foil, and warm for 6–8 minutes until heated through. Best within 3–4 days." },
  { category: "Clean Eats — Veggies", name: "Grilled Zucchini & Yellow Squash", instructions: "Preheat oven to 375°F. Place in an oven-safe dish, cover loosely with foil, and warm for 6–8 minutes until heated through. Best within 3–4 days." },
  { category: "Clean Eats — Veggies", name: "Roasted Carrots", instructions: "Preheat oven to 375°F. Transfer to an oven-safe dish, cover tightly with foil, and warm for 10–12 minutes until heated through. Best within 4–5 days." },

  // SIMPLE SALADS
  { category: "Simple Salads", name: "Simple Green Salad with Cherry Tomatoes, Cucumbers, Carrots, Pumpkin Seeds & Balsamic Vinaigrette", instructions: "Serve cold — no heating needed. Dress just before eating and toss gently. Best within 3–4 days." },
  { category: "Simple Salads", name: "Detox Salad with Kale, Broccoli, Cabbage, Carrots & Carrot Ginger Dressing", instructions: "Serve cold — no heating needed. Add avocado just before serving if stored separately. Dress just before eating and toss gently. Best within 3–4 days." }
];

function groupByCategory(dishes) {
  const groups = {};
  dishes.forEach(d => {
    if (!groups[d.category]) groups[d.category] = [];
    groups[d.category].push(d);
  });
  return groups;
}

function highlight(text, query) {
  if (!query) return text;
  const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return text.replace(new RegExp(`(${escaped})`, 'gi'), '<mark>$1</mark>');
}

function render(query) {
  const q = query.trim().toLowerCase();
  const filtered = q
    ? DISHES.filter(d => d.name.toLowerCase().includes(q) || d.category.toLowerCase().includes(q) || d.instructions.toLowerCase().includes(q))
    : DISHES;

  const list = document.getElementById('dishList');
  const empty = document.getElementById('emptyState');
  const count = document.getElementById('resultsCount');
  const clearBtn = document.getElementById('clearBtn');

  clearBtn.style.display = q ? 'block' : 'none';

  if (filtered.length === 0) {
    list.innerHTML = '';
    empty.style.display = 'block';
    document.getElementById('emptyQuery').textContent = query;
    count.textContent = '';
    return;
  }

  empty.style.display = 'none';
  count.textContent = q ? `${filtered.length} dish${filtered.length !== 1 ? 'es' : ''} found` : `${DISHES.length} dishes this week`;

  const groups = groupByCategory(filtered);
  let html = '';
  Object.entries(groups).forEach(([cat, dishes]) => {
    html += `<div class="category-block"><div class="category-label">${cat}</div>`;
    dishes.forEach((d, i) => {
      const id = `d-${cat}-${i}`.replace(/[^a-zA-Z0-9-]/g, '-');
      html += `<div class="dish-card" id="${id}" onclick="toggle('${id}')">
        <div class="dish-header">
          <div class="dish-name">${highlight(d.name, query)}</div>
          <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
        <div class="dish-instructions">${d.instructions}</div>
      </div>`;
    });
    html += `</div>`;
  });

  list.innerHTML = html;
  if (filtered.length === 1) {
    const first = list.querySelector('.dish-card');
    if (first) first.classList.add('open');
  }
}

function toggle(id) {
  document.getElementById(id).classList.toggle('open');
}

const searchInput = document.getElementById('search');
const clearBtn = document.getElementById('clearBtn');
searchInput.addEventListener('input', () => render(searchInput.value));
clearBtn.addEventListener('click', () => { searchInput.value = ''; render(''); searchInput.focus(); });
render('');
</script>
</body>
</html>
